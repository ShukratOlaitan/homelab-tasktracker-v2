controller:
  type: deployment
  replicas: 1

alloy:
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      discovery.kubernetes "tasktracker_pods" {
        role = "pod"

        namespaces {
          names = ["tasktracker-gitops"]
        }
      }

      discovery.relabel "tasktracker_pods" {
        targets = discovery.kubernetes.tasktracker_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Running"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app_name"
        }

        rule {
          source_labels = [
            "__meta_kubernetes_namespace",
            "__meta_kubernetes_pod_name",
            "__meta_kubernetes_pod_container_name",
          ]
          separator    = "/"
          target_label = "job"
        }
      }

      loki.source.kubernetes "tasktracker_pods" {
        targets    = discovery.relabel.tasktracker_pods.output
        forward_to = [loki.process.tasktracker_logs.receiver]
      }

      loki.process "tasktracker_logs" {
        stage.static_labels {
          values = {
            cluster = "desktop",
          }
        }

        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

serviceAccount:
  create: true

rbac:
  create: true
