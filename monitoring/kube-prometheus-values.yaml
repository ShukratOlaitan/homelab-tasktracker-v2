grafana:
  envFromSecret: grafana-smtp-secret
  grafana.ini:
    smtp:
      enabled: true
      from_address: shukratolaitan@gmail.com
      from_name: TaskTracker Grafana
      host: smtp.gmail.com:587
      password: $__env{GF_SMTP_PASSWORD}
      skip_verify: false
      startTLS_policy: MandatoryStartTLS
      user: $__env{GF_SMTP_USER}
  persistence:
    accessModes:
    - ReadWriteOnce
    enabled: true
    size: 5Gi
    storageClassName: standard
    type: pvc
 
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      editable: true
      jsonData:
        timeout: 60
        maxLines: 1000
 
  extraConfigmapMounts:
    - name: grafana-alerting-rules
      mountPath: /etc/grafana/provisioning/alerting/tasktracker-backend-log-errors.yaml
      subPath: tasktracker-backend-log-errors.yaml
      configMap: grafana-alerting-rules
      readOnly: true
